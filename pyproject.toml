[project]
name = "wildfire-forecast"
version = "0.1.0"
description = "Canadian wildfire escalation forecasting from open government feeds"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    # LightGBM's categorical-feature path takes a pandas frame, and the model
    # is persisted with joblib. Both are transitive today but imported
    # directly, so they are declared.
    "pandas>=2.0",
    "joblib>=1.3",
    # `wildfire report` renders the figures embedded in the README.
    "matplotlib>=3.8",
    "selectolax>=0.3",
    "tenacity>=8.2",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
scrape = ["playwright>=1.44"]
dev = ["pytest>=8.0"]

[project.scripts]
wildfire = "wildfire.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
